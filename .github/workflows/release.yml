name: Build and publish ClientRenderer GUI

on:
  push:
    branches:
      - avalonia
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.0.10"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-renderer-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read release marker
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version=""
          commit="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "avalonia" ]]; then
            subject="$(git log -1 --format=%s)"
            if [[ "$subject" =~ ^release:[[:space:]]*(v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
              version="${BASH_REMATCH[1]}"
            fi
          fi

          if [[ -z "$version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release marker found; skipping package build."
            exit 0
          fi

          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version '$version'. Use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "should_release=true"
            echo "version=$version"
            echo "commit=$commit"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "Preparing ClientRenderer release $version from commit $commit"

  build:
    name: Build ${{ matrix.platform }} Velopack package
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            runtime: win-x64
            channel: win
            main_executable: ClientRenderer.GUI.exe
          - platform: linux
            runner: ubuntu-latest
            runtime: linux-x64
            channel: linux
            main_executable: ClientRenderer.GUI
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y squashfs-tools

      - name: Install Velopack CLI on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Velopack CLI on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build and pack release
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts/publish-gui-release.ps1"
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          & $scriptPath `
            -Version "${{ needs.prepare.outputs.version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -Channel "${{ matrix.channel }}" `
            -MainExecutable "${{ matrix.main_executable }}" `
            -ChecksumFileName "SHA256SUMS-${{ matrix.platform }}.txt" `
            -OutputDirectory $outputDirectory

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ClientRenderer-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: ClientRenderer-${{ needs.prepare.outputs.version }}-windows
          path: release-assets/windows

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: ClientRenderer-${{ needs.prepare.outputs.version }}-linux
          path: release-assets/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: ClientRenderer ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/*
            release-assets/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
